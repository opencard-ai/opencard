name: Ops watchdog
on:
  schedule:
    # Explicit UTC (GitHub ignores timezone:). 07:23 PST / 08:23 PDT.
    # Chosen ~10h after the 21:09Z offer slot: scheduled runs in this repo started
    # 4–10h late on 11/13–11/15, so a late-but-successful run is normally finished.
    - cron: '23 15 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ops-watchdog.yml
      - scripts/automation/ops-watchdog.mjs
      - scripts/automation/ops-watchdog.test.mjs
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      pt_date: ${{ steps.check.outputs.pt_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fixture tests (PR preview; no secrets or send)
        run: node --test scripts/automation/ops-watchdog.test.mjs
      - name: List main workflow runs
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/offer-watch-cloud.yml/runs?branch=main&per_page=50" > "$RUNNER_TEMP/offer.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/weekly-audit-cloud.yml/runs?branch=main&per_page=50" > "$RUNNER_TEMP/audit.json"
      - name: Check freshness
        id: check
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        run: |
          node scripts/automation/ops-watchdog.mjs --offer-runs "$RUNNER_TEMP/offer.json" --audit-runs "$RUNNER_TEMP/audit.json" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out-dir "$RUNNER_TEMP/watchdog"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !startsWith(github.event_name, 'pull_request') }}
        with:
          name: ops-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/watchdog/
          if-no-files-found: error
          retention-days: 14
  notify:
    needs: check
    if: ${{ !startsWith(github.event_name, 'pull_request') && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ops-notify.yml
    with:
      job: ops-watchdog
      kind: missed
      pt_date: ${{ needs.check.outputs.pt_date }}
      summary_artifact: ops-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
      summary_file: watchdog.txt
      send: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event_name, 'pull_request') }}
    secrets:
      AGENTMAIL_API_KEY: ${{ !startsWith(github.event_name, 'pull_request') && secrets.AGENTMAIL_API_KEY || '' }}
      AGENTMAIL_FROM_INBOX: ${{ !startsWith(github.event_name, 'pull_request') && secrets.AGENTMAIL_FROM_INBOX || '' }}
      OWNER_EMAIL: ${{ !startsWith(github.event_name, 'pull_request') && secrets.OWNER_EMAIL || '' }}
