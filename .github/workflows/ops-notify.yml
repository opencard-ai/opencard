name: Ops notify (AgentMail; preview by default)
# Reusable notification step for the cloud offer watcher / weekly audit (PR #94 design, option B1).
# NOT wired into any job yet. No schedule.
# - Default and pull_request runs are PREVIEW ONLY: the sanitized email is rendered to the step summary and an
#   artifact; no secret is referenced by the preview job and nothing is sent.
# - Real sending requires ALL of: a workflow_call caller passing `send: true`, running on refs/heads/main, the
#   `--send` flag, OPS_NOTIFY_SEND=true, and the existing secret names AGENTMAIL_API_KEY / AGENTMAIL_FROM_INBOX /
#   OWNER_EMAIL (same names as card-updates.yml). Enabling it is a separate, explicitly approved step.
# - Dedupe key ops-notify:<job>:<PT date>:<run id>; recording it in the ops-state branch is a later step.
on:
  workflow_call:
    inputs:
      job:
        description: 'offer-watch or weekly-audit'
        type: string
        required: true
      pt_date:
        description: 'PT date YYYY-MM-DD of the job run'
        type: string
        required: true
      summary_artifact:
        description: 'Artifact (uploaded by the caller) containing the job stdout summary'
        type: string
        required: true
      summary_file:
        description: 'File name of the summary inside the artifact'
        type: string
        required: true
      send:
        description: 'Actually send (default false = preview only)'
        type: boolean
        default: false
    secrets:
      AGENTMAIL_API_KEY:
        required: false
      AGENTMAIL_FROM_INBOX:
        required: false
      OWNER_EMAIL:
        required: false
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/ops-notify.yml
      - scripts/automation/ops-notify*.mjs
      - scripts/automation/fixtures/ops-notify-summary.txt
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NOTIFY_JOB: ${{ inputs.job || 'offer-watch' }}
      NOTIFY_PT_DATE: ${{ inputs.pt_date || '2026-11-13' }}
      SUMMARY_ARTIFACT: ${{ inputs.summary_artifact || '' }}
      SUMMARY_FILE: ${{ inputs.summary_file || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download caller summary artifact
        if: inputs.summary_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.summary_artifact }}
          path: ${{ runner.temp }}/summary-in
      - name: Render sanitized preview (no secrets, no network)
        run: |
          if [ -n "$SUMMARY_ARTIFACT" ]; then src="$RUNNER_TEMP/summary-in/$SUMMARY_FILE"; else src=scripts/automation/fixtures/ops-notify-summary.txt; fi
          node scripts/automation/ops-notify.mjs --job "$NOTIFY_JOB" --pt-date "$NOTIFY_PT_DATE" --run-id "$GITHUB_RUN_ID" \
            --run-url "https://github.com/opencard-ai/opencard/actions/runs/$GITHUB_RUN_ID" \
            --summary-file "$src" --out-dir "$RUNNER_TEMP/notify"
          { echo "## Ops notify preview ($NOTIFY_JOB, PT $NOTIFY_PT_DATE) — NOT sent"; echo; cat "$RUNNER_TEMP/notify/notify-preview.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ops-notify-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notify/
          retention-days: 14
  send:
    # Never runs for pull_request/pull_request_target callers (incl. merged PRs whose ref is main), off main,
    # or when inputs.send is not explicitly true (it is empty on this file's own pull_request trigger).
    needs: preview
    if: inputs.send == true && github.ref == 'refs/heads/main' && !startsWith(github.event_name, 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.summary_artifact }}
          path: ${{ runner.temp }}/summary-in
      - name: Send via AgentMail (gated)
        env:
          OPS_NOTIFY_SEND: 'true'
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_FROM_INBOX: ${{ secrets.AGENTMAIL_FROM_INBOX }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          NOTIFY_JOB: ${{ inputs.job }}
          NOTIFY_PT_DATE: ${{ inputs.pt_date }}
          SUMMARY_FILE: ${{ inputs.summary_file }}
        run: |
          node scripts/automation/ops-notify.mjs --job "$NOTIFY_JOB" --pt-date "$NOTIFY_PT_DATE" --run-id "$GITHUB_RUN_ID" \
            --run-url "https://github.com/opencard-ai/opencard/actions/runs/$GITHUB_RUN_ID" \
            --summary-file "$RUNNER_TEMP/summary-in/$SUMMARY_FILE" --out-dir "$RUNNER_TEMP/notify" --send
